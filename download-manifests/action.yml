name: 'Download Manifests'
description: 'Downloads everything stored for a component version in the shared FibriCheck manifests store: its manifests and the files uploaded with them (see the files input of generate-build-manifest).'
inputs:
  component:
    description: 'Name of the component or schema'
    required: true
  version:
    description: 'Version (e.g. semver)'
    required: true
  folder:
    description: >
      Top-level folder within the manifests store: app, pages, schemas, tasks, packages, test, or composites. Everything under
      <folder>/<component>/<version>/ is downloaded.
    required: true
  path:
    description: 'Local directory to download into. Defaults to manifests/download/<component>/<version>'
    required: false
    default: ''
  fail-if-missing:
    description: "Fail when nothing is stored for this version. When 'false', the found output is 'false' instead"
    required: false
    default: 'true'
  role-arn:
    description: >
      IAM role assumed through GitHub OIDC to access the manifests store. The calling job needs the
      id-token: write permission. The credentials are only used by this action and never replace AWS
      credentials configured elsewhere in the job. Set to '' to skip authentication and use the AWS
      credentials already configured in the job instead.
    required: false
    default: 'arn:aws:iam::964503429135:role/github-manifests'
outputs:
  found:
    description: "'true' when anything was stored for this version and downloaded"
    value: ${{ steps.download.outputs.found }}
  path:
    description: 'Local directory everything was downloaded into'
    value: ${{ steps.download.outputs.path }}
  files:
    description: 'Local paths of the downloaded files, one per line'
    value: ${{ steps.download.outputs.files }}
runs:
  using: 'composite'
  steps:
    - name: Validate
      shell: bash
      env:
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FOLDER: ${{ inputs.folder }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_IF_MISSING: ${{ inputs.fail-if-missing }}
      run: |
        set -euo pipefail

        validate_no_path_traversal() {
          local name="$1" value="$2"
          case "$value" in
            '')
              echo "::error::${name} is required"
              exit 1
              ;;
            */*|*'\'*)
              echo "::error::${name} must not contain '/' or '\\'"
              exit 1
              ;;
            .|..)
              echo "::error::${name} must not be '.' or '..'"
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "::error::${name} must not contain line breaks"
              exit 1
              ;;
          esac
        }
        validate_no_path_traversal "component" "$INPUT_COMPONENT"
        validate_no_path_traversal "version" "$INPUT_VERSION"
        case "$INPUT_PATH" in
          *$'\n'*|*$'\r'*)
            echo "::error::path must not contain line breaks"
            exit 1
            ;;
        esac
        case "$INPUT_FOLDER" in
          app|pages|schemas|tasks|packages|test|composites) ;;
          *)
            echo "::error::folder must be one of: app, pages, schemas, tasks, packages, test, composites — got: ${INPUT_FOLDER}"
            exit 1
            ;;
        esac
        case "$INPUT_FAIL_IF_MISSING" in
          true|false) ;;
          *)
            echo "::error::fail-if-missing must be 'true' or 'false' — got: ${INPUT_FAIL_IF_MISSING}"
            exit 1
            ;;
        esac
    - name: Check OIDC permission
      if: inputs.role-arn != ''
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::the calling job needs the id-token: write permission to authenticate to AWS"
          exit 1
        fi
    - name: Authenticate to AWS
      id: aws-auth
      if: inputs.role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: eu-central-1
        output-credentials: true
        output-env-credentials: false
    - name: Download
      id: download
      shell: bash
      env:
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FOLDER: ${{ inputs.folder }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_IF_MISSING: ${{ inputs.fail-if-missing }}
        MANIFESTS_AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
        MANIFESTS_AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
        MANIFESTS_AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
      run: |
        set -euo pipefail

        # The manifests role's credentials apply to this step only, other AWS credentials in the job are left as they are
        if [ -n "$MANIFESTS_AWS_ACCESS_KEY_ID" ]; then
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          export AWS_ACCESS_KEY_ID="$MANIFESTS_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$MANIFESTS_AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$MANIFESTS_AWS_SESSION_TOKEN"
          export AWS_REGION="eu-central-1"
        fi

        S3_BUCKET="manifests.fibricheck.com"
        PREFIX="${INPUT_FOLDER}/${INPUT_COMPONENT}/${INPUT_VERSION}"
        DEST="${INPUT_PATH:-manifests/download/${INPUT_COMPONENT}/${INPUT_VERSION}}"
        DEST="${DEST%/}"
        printf 'path=%s\n' "$DEST" >> "$GITHUB_OUTPUT"

        # Listed separately, so a failing aws call fails the step instead of looking like an empty folder
        LISTING=$(aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "${PREFIX}/" \
          --query 'Contents[].Key' --output text)
        KEYS=$(printf '%s\n' "$LISTING" | tr '\t' '\n' | { grep -vx -e 'None' -e '' || true; })

        if [ -z "$KEYS" ]; then
          if [ "$INPUT_FAIL_IF_MISSING" = "true" ]; then
            echo "::error::Nothing stored at ${PREFIX}/"
            exit 1
          fi
          echo "Nothing stored at ${PREFIX}/"
          printf 'found=false\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Objects uploaded with a SHA256 checksum are verified against it
        FILES=""
        while IFS= read -r KEY; do
          RELATIVE="${KEY#"${PREFIX}/"}"
          case "/$RELATIVE/" in
            *//*|*/../*|*/./*)
              echo "::error::refusing to download ${KEY}: unsafe path"
              exit 1
              ;;
          esac

          TARGET="${DEST}/${RELATIVE}"
          mkdir -p "$(dirname "$TARGET")"
          EXPECTED=$(aws s3api get-object --bucket "$S3_BUCKET" --key "$KEY" --checksum-mode ENABLED \
            --query ChecksumSHA256 --output text "$TARGET")
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "None" ]; then
            ACTUAL=$(openssl dgst -sha256 -binary "$TARGET" | base64)
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::checksum mismatch for ${KEY}"
              exit 1
            fi
          fi

          FILES="${FILES}${TARGET}"$'\n'
        done <<< "$KEYS"

        DELIMITER="files_$(date +%s)_$RANDOM"
        printf 'found=true\n' >> "$GITHUB_OUTPUT"
        printf 'files<<%s\n%s%s\n' "$DELIMITER" "$FILES" "$DELIMITER" >> "$GITHUB_OUTPUT"
