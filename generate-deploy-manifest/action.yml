name: 'Generate Deploy Manifest'
description: 'Builds a deployment traceability manifest JSON, writes it locally, and uploads it to the shared FibriCheck manifests bucket. Does not commit or push. Only call this after a deploy has actually succeeded.'
inputs:
  component:
    description: 'Name of the component or schema that was deployed'
    required: true
  version:
    description: 'Version that was deployed'
    required: true
  target-environment:
    description: 'Environment this was deployed to (e.g. eu-production, us-prod)'
    required: true
  build-manifest-ref:
    description: >
      Reference to the build manifest for this version — wherever it lives (an S3 URI, a repo path,
      whatever the caller's storage convention is). Recorded as-is; not read, fetched, or validated,
      since the build manifest is expected to already be an immutable, trustworthy record on its own.
    required: true
  deployment-timestamp:
    description: 'When the deployment happened, as YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ. Defaults to now. Pass this explicitly when recording a deployment after the fact (e.g. an app store release recorded manually). A date-only value is normalized to midnight UTC.'
    required: false
    default: ''
  deploy-config:
    description: >
      Deploy-time configuration to embed as-is, same rules as generate-build-manifest's build-config:
      JSON in, JSON out; raw text in, embedded as a JSON string.
    required: false
    default: ''
  s3-folder:
    description: >
      Top-level folder within the manifests bucket: app, pages, schemas, tasks, packages, or test.
      Required — every manifest is uploaded, there is no local-only mode. Uploads always go to the
      shared FibriCheck manifests bucket (manifests.fibricheck.com); there is no way to point this
      action at a different bucket. The key defaults to
      <s3-folder>/<component>-<version>-<target-environment>-<deployment-timestamp>.deploy-manifest.json,
      or s3-key if set. Uploads are create-only and fail if the selected key already exists. Object
      Lock retention is applied by the bucket's own default retention rule, not by this action —
      "test" is not exempt from it.
    required: true
  s3-key:
    description: 'Object key to upload to within the manifests bucket. If set, used as-is instead of the s3-folder-derived default key. Must not already exist! the upload fails if it does.'
    required: false
    default: ''
outputs:
  manifest-json:
    description: 'The generated manifest, as a JSON string'
    value: ${{ steps.generate.outputs.manifest-json }}
  manifest-path:
    description: 'Path the manifest was written to'
    value: ${{ steps.generate.outputs.manifest-path }}
  s3-uri:
    description: 'The s3://bucket/key URI the manifest was uploaded to'
    value: ${{ steps.generate.outputs.s3-uri }}
runs:
  using: 'composite'
  steps:
    - name: Generate
      id: generate
      shell: bash
      env:
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
        INPUT_BUILD_MANIFEST_REF: ${{ inputs.build-manifest-ref }}
        INPUT_DEPLOYMENT_TIMESTAMP: ${{ inputs.deployment-timestamp }}
        INPUT_DEPLOY_CONFIG: ${{ inputs.deploy-config }}
        INPUT_S3_FOLDER: ${{ inputs.s3-folder }}
        INPUT_S3_KEY: ${{ inputs.s3-key }}
      run: |
        set -euo pipefail

        validate_no_path_traversal() {
          local name="$1" value="$2"
          case "$value" in
            */*|*'\'*)
              echo "::error::${name} must not contain '/' or '\\'"
              exit 1
              ;;
            .|..)
              echo "::error::${name} must not be '.' or '..'"
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "::error::${name} must not contain line breaks"
              exit 1
              ;;
          esac
        }
        validate_no_line_breaks() {
          local name="$1" value="$2"
          case "$value" in
            *$'\n'*|*$'\r'*)
              echo "::error::${name} must not contain line breaks"
              exit 1
              ;;
          esac
        }
        validate_no_path_traversal "component" "$INPUT_COMPONENT"
        validate_no_path_traversal "version" "$INPUT_VERSION"
        validate_no_path_traversal "target-environment" "$INPUT_TARGET_ENVIRONMENT"
        case "$INPUT_S3_FOLDER" in
          app|pages|schemas|tasks|packages|test) ;;
          *)
            echo "::error::s3-folder must be one of: app, pages, schemas, tasks, packages, test — got: ${INPUT_S3_FOLDER}"
            exit 1
            ;;
        esac
        validate_no_line_breaks "s3-key" "$INPUT_S3_KEY"

        TIMESTAMP="$INPUT_DEPLOYMENT_TIMESTAMP"
        [ -z "$TIMESTAMP" ] && TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          TIMESTAMP="${TIMESTAMP}T00:00:00Z"
        elif ! [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "::error::deployment-timestamp must use YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ"
          exit 1
        fi

        FILENAME_SAFE_TIMESTAMP=$(echo "$TIMESTAMP" | tr -d ':')
        OUTPUT_PATH="manifests/deploy/${INPUT_COMPONENT}/${INPUT_VERSION}-${INPUT_TARGET_ENVIRONMENT}-${FILENAME_SAFE_TIMESTAMP}.json"
        mkdir -p "$(dirname "$OUTPUT_PATH")"

        DEPLOY_CONFIG_INPUT="$INPUT_DEPLOY_CONFIG"
        if [ -z "$DEPLOY_CONFIG_INPUT" ]; then
          DEPLOY_CONFIG=null
        elif echo "$DEPLOY_CONFIG_INPUT" | jq empty 2>/dev/null; then
          DEPLOY_CONFIG="$DEPLOY_CONFIG_INPUT"
        else
          DEPLOY_CONFIG=$(printf '%s' "$DEPLOY_CONFIG_INPUT" | jq -Rs '.')
        fi

        MANIFEST=$(jq -n \
          --arg buildManifestRef "$INPUT_BUILD_MANIFEST_REF" \
          --arg component "$INPUT_COMPONENT" \
          --arg version "$INPUT_VERSION" \
          --arg targetEnvironment "$INPUT_TARGET_ENVIRONMENT" \
          --arg deploymentTimestamp "$TIMESTAMP" \
          --argjson deployConfig "$DEPLOY_CONFIG" \
          '{
            manifestVersion: "1.0",
            buildManifestRef: $buildManifestRef,
            component: $component,
            version: $version,
            targetEnvironment: $targetEnvironment,
            deploymentTimestamp: $deploymentTimestamp,
            deployConfig: $deployConfig
          }')

        printf '%s\n' "$MANIFEST" > "$OUTPUT_PATH"

        S3_BUCKET="manifests.fibricheck.com"

        S3_KEY="$INPUT_S3_KEY"
        if [ -z "$S3_KEY" ]; then
          S3_KEY="${INPUT_S3_FOLDER}/${INPUT_COMPONENT}-${INPUT_VERSION}-${INPUT_TARGET_ENVIRONMENT}-${FILENAME_SAFE_TIMESTAMP}.deploy-manifest.json"
        fi

        # Create-only upload: every deployment record must have its own unused key.
        aws s3api put-object --bucket "$S3_BUCKET" --key "$S3_KEY" --body "$OUTPUT_PATH" --if-none-match '*' >/dev/null
        S3_URI="s3://${S3_BUCKET}/${S3_KEY}"

        DELIMITER="manifest_$(date +%s)_$RANDOM"
        printf 'manifest-path=%s\n' "$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        printf 's3-uri=%s\n' "$S3_URI" >> "$GITHUB_OUTPUT"
        printf 'manifest-json<<%s\n%s\n%s\n' "$DELIMITER" "$MANIFEST" "$DELIMITER" >> "$GITHUB_OUTPUT"
