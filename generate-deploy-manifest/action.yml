name: 'Generate Deploy Manifest'
description: 'Builds a deployment traceability manifest JSON, writes it locally, and stores it in the shared FibriCheck manifests store. Does not commit or push. Only call this after a deploy has actually succeeded.'
inputs:
  component:
    description: 'Name of the component or schema that was deployed'
    required: true
  version:
    description: 'Version that was deployed'
    required: true
  target-environment:
    description: 'Environment this was deployed to (e.g. eu-production, us-prod)'
    required: true
  build-number:
    description: 'Platform build number, when the deployed component has one.'
    required: false
    default: ''
  build-manifest-ref:
    description: >
      Reference to the build manifest for this version: the manifest-ref output of generate-build-manifest
      (e.g. tasks/delete-user/1.1.7/build-manifest.json). Recorded as-is; not read, fetched, or validated,
      since the build manifest is expected to already be an immutable, trustworthy record on its own.
    required: true
  deployment-timestamp:
    description: 'When the deployment happened, as YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ. Defaults to now. Pass this explicitly when recording a deployment after the fact (e.g. an app store release recorded manually). A date-only value is normalized to midnight UTC.'
    required: false
    default: ''
  component-manifests:
    description: >
      Comma-separated list of existing component deploy manifests this manifest combines, as manifest
      references (the manifest-ref output of the action that created them). Each one must be a deploy
      manifest and must exist; the action fails before uploading anything if one does not. folder must
      be composites when this is given.
    required: false
    default: ''
  deploy-config:
    description: >
      Deploy-time configuration to embed as-is, same rules as generate-build-manifest's build-config:
      JSON in, JSON out; raw text in, embedded as a JSON string.
    required: false
    default: ''
  folder:
    description: >
      Top-level folder within the manifests store: app, pages, schemas, tasks, packages, test, or composites.
      composites is required when component-manifests is given, and not allowed otherwise.
      Required — every manifest is stored, there is no local-only mode. The manifest is stored as
      <folder>/<component>/<version>/<target-environment>.[<build-number>.]<deployment-timestamp>.deploy-manifest.json.
      Storing is create-only and fails if the manifest already exists. Retention is applied by the
      store's own default retention rule, not by this action — "test" is not exempt from it.
    required: true
  role-arn:
    description: >
      IAM role assumed through GitHub OIDC to access the manifests store. The calling job needs the
      id-token: write permission. The credentials are only used by this action and never replace AWS
      credentials configured elsewhere in the job. Set to '' to skip authentication and use the AWS
      credentials already configured in the job instead.
    required: false
    default: 'arn:aws:iam::964503429135:role/github-manifests'
outputs:
  manifest-json:
    description: 'The generated manifest, as a JSON string'
    value: ${{ steps.generate.outputs.manifest-json }}
  manifest-path:
    description: 'Path the manifest was written to'
    value: ${{ steps.generate.outputs.manifest-path }}
  manifest-ref:
    description: 'Reference to the stored manifest'
    value: ${{ steps.generate.outputs.manifest-ref }}
runs:
  using: 'composite'
  steps:
    - name: Check OIDC permission
      if: inputs.role-arn != ''
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::the calling job needs the id-token: write permission to authenticate to AWS"
          exit 1
        fi
    - name: Authenticate to AWS
      id: aws-auth
      if: inputs.role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: eu-central-1
        output-credentials: true
        output-env-credentials: false
    - name: Generate
      id: generate
      shell: bash
      env:
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
        INPUT_BUILD_NUMBER: ${{ inputs.build-number }}
        INPUT_BUILD_MANIFEST_REF: ${{ inputs.build-manifest-ref }}
        INPUT_DEPLOYMENT_TIMESTAMP: ${{ inputs.deployment-timestamp }}
        INPUT_COMPONENT_MANIFESTS: ${{ inputs.component-manifests }}
        INPUT_DEPLOY_CONFIG: ${{ inputs.deploy-config }}
        INPUT_FOLDER: ${{ inputs.folder }}
        MANIFESTS_AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
        MANIFESTS_AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
        MANIFESTS_AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
      run: |
        set -euo pipefail

        # The manifests role's credentials apply to this step only, other AWS credentials in the job are left as they are
        if [ -n "$MANIFESTS_AWS_ACCESS_KEY_ID" ]; then
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          export AWS_ACCESS_KEY_ID="$MANIFESTS_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$MANIFESTS_AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$MANIFESTS_AWS_SESSION_TOKEN"
          export AWS_REGION="eu-central-1"
        fi

        validate_no_path_traversal() {
          local name="$1" value="$2"
          case "$value" in
            */*|*'\'*)
              echo "::error::${name} must not contain '/' or '\\'"
              exit 1
              ;;
            .|..)
              echo "::error::${name} must not be '.' or '..'"
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "::error::${name} must not contain line breaks"
              exit 1
              ;;
          esac
        }
        validate_no_path_traversal "component" "$INPUT_COMPONENT"
        validate_no_path_traversal "version" "$INPUT_VERSION"
        validate_no_path_traversal "target-environment" "$INPUT_TARGET_ENVIRONMENT"
        if [ -n "$INPUT_BUILD_NUMBER" ]; then
          validate_no_path_traversal "build-number" "$INPUT_BUILD_NUMBER"
        fi
        case "$INPUT_FOLDER" in
          app|pages|schemas|tasks|packages|test|composites) ;;
          *)
            echo "::error::folder must be one of: app, pages, schemas, tasks, packages, test, composites — got: ${INPUT_FOLDER}"
            exit 1
            ;;
        esac

        S3_BUCKET="manifests.fibricheck.com"

        COMPONENT_MANIFESTS=$(jq -Rn --arg value "$INPUT_COMPONENT_MANIFESTS" '$value | split(",") | map(select(length > 0))')

        # Composite manifests live in the composites folder, and only there
        if [ "$(jq 'length' <<< "$COMPONENT_MANIFESTS")" -gt 0 ] && [ "$INPUT_FOLDER" != "composites" ]; then
          echo "::error::folder must be composites when component-manifests is given — got: ${INPUT_FOLDER}"
          exit 1
        fi
        if [ "$(jq 'length' <<< "$COMPONENT_MANIFESTS")" -eq 0 ] && [ "$INPUT_FOLDER" = "composites" ]; then
          echo "::error::folder composites requires component-manifests"
          exit 1
        fi

        # Every referenced component manifest must already exist, checked before anything is uploaded
        HEAD_ERR=$(mktemp)
        while IFS= read -r REF; do
          KEY="$REF"
          case "/$KEY/" in
            *//*|*/../*|*/./*)
              echo "::error::component-manifests must be manifest references (the manifest-ref output of the action that created them) — got: ${REF}"
              exit 1
              ;;
          esac
          if [[ "${KEY##*/}" != *.deploy-manifest.json ]]; then
            echo "::error::component-manifests must reference deploy manifests — got: ${REF}"
            exit 1
          fi
          if ! aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" >/dev/null 2>"$HEAD_ERR"; then
            if grep -q "(404)" "$HEAD_ERR"; then
              echo "::error::component manifest does not exist: ${REF}"
            else
              cat "$HEAD_ERR" >&2
            fi
            exit 1
          fi
        done < <(jq -r '.[]' <<< "$COMPONENT_MANIFESTS")
        rm -f "$HEAD_ERR"

        TIMESTAMP="$INPUT_DEPLOYMENT_TIMESTAMP"
        [ -z "$TIMESTAMP" ] && TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          TIMESTAMP="${TIMESTAMP}T00:00:00Z"
        elif ! [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "::error::deployment-timestamp must use YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ"
          exit 1
        fi

        FILENAME_SAFE_TIMESTAMP=$(echo "$TIMESTAMP" | tr -d ':')
        OUTPUT_PATH="manifests/deploy/${INPUT_COMPONENT}/${INPUT_VERSION}-${INPUT_TARGET_ENVIRONMENT}-${FILENAME_SAFE_TIMESTAMP}.json"
        mkdir -p "$(dirname "$OUTPUT_PATH")"

        DEPLOY_CONFIG_INPUT="$INPUT_DEPLOY_CONFIG"
        if [ -z "$DEPLOY_CONFIG_INPUT" ]; then
          DEPLOY_CONFIG=null
        elif echo "$DEPLOY_CONFIG_INPUT" | jq empty 2>/dev/null; then
          DEPLOY_CONFIG="$DEPLOY_CONFIG_INPUT"
        else
          DEPLOY_CONFIG=$(printf '%s' "$DEPLOY_CONFIG_INPUT" | jq -Rs '.')
        fi

        BUILD_NUMBER="$INPUT_BUILD_NUMBER"
        [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER=null || BUILD_NUMBER=$(jq -Rn --arg v "$BUILD_NUMBER" '$v')

        MANIFEST=$(jq -n \
          --arg buildManifestRef "$INPUT_BUILD_MANIFEST_REF" \
          --arg component "$INPUT_COMPONENT" \
          --arg version "$INPUT_VERSION" \
          --arg targetEnvironment "$INPUT_TARGET_ENVIRONMENT" \
          --argjson buildNumber "$BUILD_NUMBER" \
          --arg deploymentTimestamp "$TIMESTAMP" \
          --argjson componentManifests "$COMPONENT_MANIFESTS" \
          --argjson deployConfig "$DEPLOY_CONFIG" \
          '{
            manifestVersion: "1.0",
            buildManifestRef: $buildManifestRef,
            component: $component,
            version: $version,
            targetEnvironment: $targetEnvironment,
            buildNumber: $buildNumber,
            deploymentTimestamp: $deploymentTimestamp,
            componentManifests: $componentManifests,
            deployConfig: $deployConfig
          }')

        printf '%s\n' "$MANIFEST" > "$OUTPUT_PATH"

        BUILD_NUMBER_SEGMENT=""
        [ -n "$INPUT_BUILD_NUMBER" ] && BUILD_NUMBER_SEGMENT="${INPUT_BUILD_NUMBER}."
        S3_KEY="${INPUT_FOLDER}/${INPUT_COMPONENT}/${INPUT_VERSION}/${INPUT_TARGET_ENVIRONMENT}.${BUILD_NUMBER_SEGMENT}${FILENAME_SAFE_TIMESTAMP}.deploy-manifest.json"

        # Create-only upload: every deployment record must have its own unused key.
        aws s3api put-object --bucket "$S3_BUCKET" --key "$S3_KEY" --body "$OUTPUT_PATH" --if-none-match '*' >/dev/null

        DELIMITER="manifest_$(date +%s)_$RANDOM"
        printf 'manifest-path=%s\n' "$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        printf 'manifest-ref=%s\n' "$S3_KEY" >> "$GITHUB_OUTPUT"
        printf 'manifest-json<<%s\n%s\n%s\n' "$DELIMITER" "$MANIFEST" "$DELIMITER" >> "$GITHUB_OUTPUT"
