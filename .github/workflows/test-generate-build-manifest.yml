name: Test Generate Build Manifest

on:
  workflow_call:

jobs:
  test-generate-build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mock aws CLI (S3 tests run without a real bucket/credentials)
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cat > "$RUNNER_TEMP/mock-bin/aws" <<'MOCKEOF'
          #!/bin/bash
          echo "$*" >> "$RUNNER_TEMP/aws-calls.log"
          if [[ "$*" == *"/already-exists/"*"build-manifest.json"* ]]; then
            echo "PreconditionFailed: object already exists" >&2
            exit 1
          fi
          # Files under exists-same/ and exists-different/ are already in the bucket
          if [[ "$2" == put-object && "$*" == *"--if-none-match"* && "$*" == *"/exists-"*"/build-files/"* ]]; then
            echo "An error occurred (PreconditionFailed) when calling the PutObject operation" >&2
            exit 254
          fi
          if [[ "$2" == put-object && "$*" == *"/put-error/"*"/build-files/"* ]]; then
            echo "An error occurred (AccessDenied) when calling the PutObject operation" >&2
            exit 254
          fi
          # Component manifests under missing-component/ do not exist, those under forbidden-component/ cannot be read
          if [[ "$2" == head-object && "$*" == *"/missing-component/"* ]]; then
            echo "An error occurred (404) when calling the HeadObject operation: Not Found" >&2
            exit 254
          fi
          if [[ "$2" == head-object && "$*" == *"/forbidden-component/"* ]]; then
            echo "An error occurred (403) when calling the HeadObject operation: Forbidden" >&2
            exit 254
          fi
          if [[ "$2" == head-object ]]; then
            if [[ "$*" == *"/exists-same/"* ]]; then openssl dgst -sha256 -binary build-files/code.zip | base64; else echo wrong; fi
          fi
          exit 0
          MOCKEOF
          chmod +x "$RUNNER_TEMP/mock-bin/aws"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Generate build manifest with structured configuration
        id: generate-structured-config
        uses: ./generate-build-manifest
        with:
          component: fibricheck-app
          version: 2.16.0
          repo: fibricheck/fibricheck_react_native
          commit-sha: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
          build-number: "146"
          target-environment: eu-production
          ci-reference: "9876543210"
          build-output-references: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/fibricheck-app:2.16.0,FibriCheck-2.16.0-146-eu-prod.ipa
          build-config: '{"region":"eu","FEATURE_ECG":true}'
          tooling: '{"node":"20.19.4","xcode":"16.4","gradle":"8.13"}'
          s3-folder: app

      - name: manifest has all fields populated correctly
        run: |
          MANIFEST='${{ steps.generate-structured-config.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.component')" = "fibricheck-app" ]
          [ "$(echo "$MANIFEST" | jq -r '.commit.sha')" = "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2" ]
          [ "$(echo "$MANIFEST" | jq -r '.commit.tag')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.manifestVersion')" = "1.0" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildNumber')" = "146" ]
          [ "$(echo "$MANIFEST" | jq -r '.targetEnvironment')" = "eu-production" ]
          [ "$(echo "$MANIFEST" | jq -r '.ciReference')" = "9876543210" ]
          [ "$(echo "$MANIFEST" | jq -c '.buildOutputReferences')" = '["123456789012.dkr.ecr.eu-west-1.amazonaws.com/fibricheck-app:2.16.0","FibriCheck-2.16.0-146-eu-prod.ipa"]' ]
          [ "$(echo "$MANIFEST" | jq -r 'has("productIdentifiers")')" = "false" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildConfig.region')" = "eu" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildConfig.FEATURE_ECG')" = "true" ]
          [ "$(echo "$MANIFEST" | jq -r '.tooling.xcode')" = "16.4" ]
          TIMESTAMP=$(echo "$MANIFEST" | jq -r '.buildTimestamp' | tr -d ':')
          [ -f "${{ steps.generate-structured-config.outputs.manifest-path }}" ]
          [ "${{ steps.generate-structured-config.outputs.manifest-path }}" = "manifests/build/fibricheck-app-2.16.0-${TIMESTAMP}.json" ]
          [ "${{ steps.generate-structured-config.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/app/fibricheck-app/2.16.0-146/eu-production.build-manifest.json" ]

      - name: Generate build manifest with raw-text configuration
        id: generate-raw-text-config
        uses: ./generate-build-manifest
        with:
          component: pages-portal
          version: 1.0.0
          repo: fibricheck/pages-portal
          commit-sha: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          s3-folder: pages
          build-config: |
            VITE_FEATURE_US=false
            VITE_TARGET_HOST=https://api.example.com?token=abc=123

      - name: raw-text build-config preserved literally
        run: |
          MANIFEST='${{ steps.generate-raw-text-config.outputs.manifest-json }}'
          CONFIG=$(echo "$MANIFEST" | jq -r '.buildConfig')
          echo "$CONFIG" | grep -q "VITE_FEATURE_US=false"
          echo "$CONFIG" | grep -q "VITE_TARGET_HOST=https://api.example.com?token=abc=123"

      - name: Generate build manifest without optional fields
        id: generate-without-optional-fields
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas

      - name: optional fields default to null when omitted
        run: |
          MANIFEST='${{ steps.generate-without-optional-fields.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.buildConfig')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.udi')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildOutputReferences | length')" = "0" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildNumber')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.targetEnvironment')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.ciReference')" = "null" ]
          [ "$(echo "$MANIFEST" | jq -r '.componentManifests | length')" = "0" ]
          [ "$(echo "$MANIFEST" | jq -r '.tooling')" = "null" ]
          TIMESTAMP=$(echo "$MANIFEST" | jq -r '.buildTimestamp' | tr -d ':')
          [ "${{ steps.generate-without-optional-fields.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/build-manifest.json" ]
          grep -q -- "--bucket manifests.fibricheck.com --key schemas/blood-pressure-measurements/1.0.0/build-manifest.json --body manifests/build/blood-pressure-measurements-1.0.0-${TIMESTAMP}.json --if-none-match \*" "$RUNNER_TEMP/aws-calls.log"

      - name: Generate build manifest containing shell-like literal data
        id: generate-literal-data
        uses: ./generate-build-manifest
        with:
          component: "page's-component"
          version: "1.0.0"
          repo: fibricheck/pages-portal
          commit-sha: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          commit-tag: "release-'quoted'"
          s3-folder: pages
          build-config: |
            LABEL=customer's portal
            COMMAND=$(this-must-not-run)
            TICKS=`this-must-not-run-either`

      - name: quotes and shell-like text remain literal
        env:
          MANIFEST: ${{ steps.generate-literal-data.outputs.manifest-json }}
        run: |
          [ "$(jq -r '.component' <<< "$MANIFEST")" = "page's-component" ]
          [ "$(jq -r '.commit.tag' <<< "$MANIFEST")" = "release-'quoted'" ]
          jq -e '.buildConfig | contains("COMMAND=$(this-must-not-run)")' <<< "$MANIFEST"
          jq -e '.buildConfig | contains("TICKS=`this-must-not-run-either`")' <<< "$MANIFEST"

      - name: Generate build manifest with an explicit backdated build-timestamp
        id: generate-backdated
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          target-environment: eu-production
          build-timestamp: "2026-08-01T00:00:00Z"
          s3-folder: schemas

      - name: explicit build-timestamp is used as-is
        run: |
          MANIFEST='${{ steps.generate-backdated.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.buildTimestamp')" = "2026-08-01T00:00:00Z" ]
          [ "${{ steps.generate-backdated.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/eu-production.build-manifest.json" ]

      - name: Generate build manifest with a date-only build-timestamp
        id: generate-date-only
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          build-timestamp: "2026-08-02"
          s3-folder: schemas

      - name: date-only build-timestamp is normalized to midnight UTC
        run: |
          MANIFEST='${{ steps.generate-date-only.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.buildTimestamp')" = "2026-08-02T00:00:00Z" ]
          [ "${{ steps.generate-date-only.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/build-manifest.json" ]

      - name: generate-invalid-build-timestamp-should-fail
        id: generate-invalid-timestamp
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          build-timestamp: "../../../../tmp/file"
          s3-folder: schemas

      - name: invalid build-timestamp fails loudly
        run: |
          [ "${{ steps.generate-invalid-timestamp.outcome }}" = "failure" ]

      - name: generate-invalid-tooling-should-fail
        id: generate-invalid-tooling
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas
          tooling: '["node","20"]'

      - name: invalid tooling fails loudly
        run: |
          [ "${{ steps.generate-invalid-tooling.outcome }}" = "failure" ]

      - name: generate-path-traversal-component-should-fail
        id: generate-traversal
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: "../../etc/passwd"
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas

      - name: path-traversal component fails loudly
        run: |
          [ "${{ steps.generate-traversal.outcome }}" = "failure" ]

      - name: generate-line-break-component-should-fail
        id: generate-line-break
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: |-
            invalid
            component
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas

      - name: line-break component fails loudly
        run: |
          [ "${{ steps.generate-line-break.outcome }}" = "failure" ]

      - name: Existing build manifest is not overwritten
        id: generate-existing-build-manifest
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: already-exists
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas

      - name: Existing build manifest fails loudly
        run: |
          [ "${{ steps.generate-existing-build-manifest.outcome }}" = "failure" ]

      - name: generate-composite
        id: generate-composite
        uses: ./generate-build-manifest
        with:
          component: fibricheck-platform
          version: 3.0.0
          s3-folder: test
          component-manifests: s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/build-manifest.json,s3://manifests.fibricheck.com/app/fibricheck-app-ios/2.16.0-146/eu-production.build-manifest.json

      - name: composite lists its component manifests, checks each exists, and has no commit
        run: |
          MANIFEST='${{ steps.generate-composite.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -c '.componentManifests')" = '["s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/build-manifest.json","s3://manifests.fibricheck.com/app/fibricheck-app-ios/2.16.0-146/eu-production.build-manifest.json"]' ]
          [ "$(echo "$MANIFEST" | jq -c '.commit')" = '{"repo":null,"sha":null,"tag":null}' ]
          grep -q -- "head-object --bucket manifests.fibricheck.com --key schemas/blood-pressure-measurements/1.0.0/build-manifest.json" "$RUNNER_TEMP/aws-calls.log"
          grep -q -- "head-object --bucket manifests.fibricheck.com --key app/fibricheck-app-ios/2.16.0-146/eu-production.build-manifest.json" "$RUNNER_TEMP/aws-calls.log"
          [ "${{ steps.generate-composite.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/test/fibricheck-platform/3.0.0/build-manifest.json" ]

      - name: generate-composite-with-missing-component-should-fail
        id: generate-composite-missing
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: composite-missing
          version: 3.0.0
          s3-folder: test
          component-manifests: s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/build-manifest.json,s3://manifests.fibricheck.com/schemas/missing-component/1.0.0/build-manifest.json

      - name: a missing component manifest fails, and nothing is uploaded
        run: |
          [ "${{ steps.generate-composite-missing.outcome }}" = "failure" ]
          ! grep -q -- "put-object .*--key test/composite-missing/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-composite-with-unreadable-component-should-fail
        id: generate-composite-forbidden
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: composite-forbidden
          version: 3.0.0
          s3-folder: test
          component-manifests: s3://manifests.fibricheck.com/schemas/forbidden-component/1.0.0/build-manifest.json

      - name: an unreadable component manifest fails, and nothing is uploaded
        run: |
          [ "${{ steps.generate-composite-forbidden.outcome }}" = "failure" ]
          ! grep -q -- "put-object .*--key test/composite-forbidden/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-composite-with-other-bucket-should-fail
        id: generate-composite-other-bucket
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: composite-other-bucket
          version: 3.0.0
          s3-folder: test
          component-manifests: s3://some-other-bucket/schemas/blood-pressure-measurements/1.0.0/build-manifest.json

      - name: a component manifest outside the manifests bucket fails, and nothing is uploaded
        run: |
          [ "${{ steps.generate-composite-other-bucket.outcome }}" = "failure" ]
          ! grep -q -- "--key test/composite-other-bucket/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-composite-with-deploy-manifest-should-fail
        id: generate-composite-deploy-manifest
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: composite-deploy-manifest
          version: 3.0.0
          s3-folder: test
          component-manifests: s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0/eu-production.2026-09-07T101502Z.deploy-manifest.json

      - name: a component manifest that is not a build manifest fails, and nothing is checked or uploaded
        run: |
          [ "${{ steps.generate-composite-deploy-manifest.outcome }}" = "failure" ]
          ! grep -q -- "--key schemas/blood-pressure-measurements/1.0.0/eu-production.2026-09-07T101502Z.deploy-manifest.json" "$RUNNER_TEMP/aws-calls.log"
          ! grep -q -- "--key test/composite-deploy-manifest/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-without-commit-sha-or-component-manifests-should-fail
        id: generate-no-source
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: no-source
          version: 3.0.0
          repo: fibricheck/fibricheck-schemas
          s3-folder: test

      - name: missing commit-sha and component-manifests fails, and nothing is uploaded
        run: |
          [ "${{ steps.generate-no-source.outcome }}" = "failure" ]
          ! grep -q -- "--key test/no-source/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-commit-sha-without-repo-should-fail
        id: generate-sha-without-repo
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: sha-without-repo
          version: 3.0.0
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: test

      - name: commit-sha without repo fails, and nothing is uploaded
        run: |
          [ "${{ steps.generate-sha-without-repo.outcome }}" = "failure" ]
          ! grep -q -- "--key test/sha-without-repo/" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-s3-folder-with-build-number
        id: generate-s3-folder-buildnum
        uses: ./generate-build-manifest
        with:
          component: fibricheck-app-ios
          version: 2.16.0
          repo: fibricheck/fibricheck_react_native
          commit-sha: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
          build-number: "146"
          s3-folder: app

      - name: s3-folder includes build-number in key
        run: |
          [ "${{ steps.generate-s3-folder-buildnum.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/app/fibricheck-app-ios/2.16.0-146/build-manifest.json" ]

      - name: generate-missing-s3-folder-should-fail
        id: generate-missing-folder
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: ""

      - name: missing s3-folder fails loudly
        run: |
          [ "${{ steps.generate-missing-folder.outcome }}" = "failure" ]

      - name: generate-invalid-s3-folder-should-fail
        id: generate-bad-folder
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: shema

      - name: invalid s3-folder fails loudly
        run: |
          [ "${{ steps.generate-bad-folder.outcome }}" = "failure" ]

      - name: generate-s3-folder-test
        id: generate-s3-folder-test
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: test

      - name: s3-folder value "test" is accepted
        run: |
          [ "${{ steps.generate-s3-folder-test.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/test/blood-pressure-measurements/1.0.0/build-manifest.json" ]

      - name: Create build files
        run: |
          mkdir -p build-files/test-results/sub
          echo zip > build-files/code.zip
          echo junit > build-files/test-results/junit.xml
          echo log > build-files/test-results/sub/test-output.log

      - name: generate-with-files
        id: generate-with-files
        uses: ./generate-build-manifest
        with:
          component: delete-user
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: |
            build-files/code.zip
            ./build-files/test-results/

      - name: files are uploaded next to the manifest, before the manifest
        run: |
          PREFIX="tasks/delete-user/1.1.7"
          [[ "${{ steps.generate-with-files.outputs.s3-uri }}" =~ ^s3://manifests\.fibricheck\.com/$PREFIX/[^/]+\.build-manifest\.json$ ]]
          URIS='${{ steps.generate-with-files.outputs.files-s3-uris }}'
          [ "$(echo "$URIS" | grep -c .)" = "3" ]
          echo "$URIS" | grep -qx "s3://manifests.fibricheck.com/$PREFIX/build-files/code.zip"
          echo "$URIS" | grep -qx "s3://manifests.fibricheck.com/$PREFIX/build-files/test-results/sub/test-output.log"
          grep -q -- "--key $PREFIX/build-files/code.zip --body build-files/code.zip --checksum-algorithm SHA256 --checksum-sha256 .* --if-none-match \*" "$RUNNER_TEMP/aws-calls.log"
          FILE_LINE=$(grep -n -- "--key $PREFIX/build-files/code.zip" "$RUNNER_TEMP/aws-calls.log" | cut -d: -f1)
          MANIFEST_LINE=$(grep -n -- "--key $PREFIX/[^/ ]*\.build-manifest\.json" "$RUNNER_TEMP/aws-calls.log" | cut -d: -f1)
          [ "$FILE_LINE" -lt "$MANIFEST_LINE" ]

      - name: generate-with-traversal-file-should-fail
        id: generate-traversal-file
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: delete-user
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: ../build-files/code.zip

      - name: traversal file fails loudly
        run: |
          [ "${{ steps.generate-traversal-file.outcome }}" = "failure" ]

      - name: generate-with-missing-file-should-fail
        id: generate-missing-file
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: delete-user
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/missing.zip

      - name: missing file fails loudly
        run: |
          [ "${{ steps.generate-missing-file.outcome }}" = "failure" ]

      - name: generate-with-double-slash-file-should-fail
        id: generate-double-slash-file
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: delete-user
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files//code.zip

      - name: double slash file fails loudly
        run: |
          [ "${{ steps.generate-double-slash-file.outcome }}" = "failure" ]

      - name: generate-with-force-upload
        id: generate-force-upload
        uses: ./generate-build-manifest
        with:
          component: forced
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/code.zip
          force-upload: 'true'

      - name: forced files are uploaded without if-none-match, the manifest with it
        run: |
          grep -- "--key tasks/forced/1.1.7/build-files/code.zip " "$RUNNER_TEMP/aws-calls.log" | grep -vq -- "--if-none-match"
          grep -q -- "--key tasks/forced/1.1.7/build-manifest.json .*--if-none-match \*" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-with-existing-same-file
        id: generate-exists-same
        uses: ./generate-build-manifest
        with:
          component: exists-same
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/code.zip

      - name: an existing file with the same checksum is accepted
        run: |
          grep -q -- "head-object --bucket manifests.fibricheck.com --key tasks/exists-same/1.1.7/build-files/code.zip" "$RUNNER_TEMP/aws-calls.log"
          grep -q -- "--key tasks/exists-same/1.1.7/build-manifest.json" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-with-existing-different-file-should-fail
        id: generate-exists-different
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: exists-different
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/code.zip

      - name: an existing file with a different checksum fails, and no manifest is uploaded
        run: |
          [ "${{ steps.generate-exists-different.outcome }}" = "failure" ]
          ! grep -q -- "--key tasks/exists-different/1.1.7/build-manifest.json" "$RUNNER_TEMP/aws-calls.log"

      - name: generate-with-put-error-should-fail
        id: generate-put-error
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: put-error
          version: 1.1.7
