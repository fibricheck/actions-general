          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/code.zip

      - name: a failing file upload fails, and no manifest is uploaded
        run: |
          [ "${{ steps.generate-put-error.outcome }}" = "failure" ]
          ! grep -q -- "--key tasks/put-error/1.1.7/build-manifest.json" "$RUNNER_TEMP/aws-calls.log"

      - name: Create an empty directory and a manifest-named file
        run: |
          mkdir -p build-files/empty
          echo '{}' > build-files/other.build-manifest.json

      - name: generate-with-empty-directory-should-fail
        id: generate-empty-dir
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: delete-user
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: build-files/empty/

      - name: an empty directory fails loudly
        run: |
          [ "${{ steps.generate-empty-dir.outcome }}" = "failure" ]

      - name: generate-with-manifest-named-file-should-fail
        id: generate-manifest-named
        continue-on-error: true
        uses: ./generate-build-manifest
        with:
          component: manifest-named
          version: 1.1.7
          repo: fibricheck/taskmaster
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: tasks
          files: |
            build-files/code.zip
            build-files/other.build-manifest.json

      - name: a manifest-named file fails before anything is uploaded
        run: |
          [ "${{ steps.generate-manifest-named.outcome }}" = "failure" ]
          ! grep -q -- "tasks/manifest-named/1.1.7/" "$RUNNER_TEMP/aws-calls.log"

