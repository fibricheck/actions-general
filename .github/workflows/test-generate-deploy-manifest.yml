name: Test Generate Deploy Manifest

on:
  workflow_call:

jobs:
  test-generate-deploy-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mock aws CLI (S3 tests run without a real bucket/credentials)
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cat > "$RUNNER_TEMP/mock-bin/aws" <<'MOCKEOF'
          #!/bin/bash
          echo "$*" >> "$RUNNER_TEMP/aws-calls.log"
          if [[ "$*" == *"already-exists.deploy-manifest.json"* ]]; then
            echo "PreconditionFailed: object already exists" >&2
            exit 1
          fi
          exit 0
          MOCKEOF
          chmod +x "$RUNNER_TEMP/mock-bin/aws"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: generate-build (fixture for the deploy manifest to reference)
        id: generate-build
        uses: ./generate-build-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          repo: fibricheck/fibricheck-schemas
          commit-sha: c16817c46c2e4d9c7966bb4991e109b7fca5ea9d
          s3-folder: schemas

      - name: Generate deploy manifest with all fields
        id: generate-all-fields
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          deploy-config: '{"rolloutPercentage":100}'
          s3-folder: schemas

      - name: manifest has all fields populated correctly
        run: |
          MANIFEST='${{ steps.generate-all-fields.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.component')" = "blood-pressure-measurements" ]
          [ "$(echo "$MANIFEST" | jq -r '.manifestVersion')" = "1.0" ]
          [ "$(echo "$MANIFEST" | jq -r '.targetEnvironment')" = "eu-production" ]
          [ "$(echo "$MANIFEST" | jq -r '.buildManifestRef')" = "${{ steps.generate-build.outputs.manifest-path }}" ]
          [ "$(echo "$MANIFEST" | jq -r '.deployConfig.rolloutPercentage')" = "100" ]
          TIMESTAMP=$(echo "$MANIFEST" | jq -r '.deploymentTimestamp' | tr -d ':')
          [ -n "$TIMESTAMP" ]
          [ -f "${{ steps.generate-all-fields.outputs.manifest-path }}" ]
          [ "${{ steps.generate-all-fields.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements-1.0.0-eu-production-${TIMESTAMP}.deploy-manifest.json" ]
          grep -q -- "--key schemas/blood-pressure-measurements-1.0.0-eu-production-${TIMESTAMP}.deploy-manifest.json --body" "$RUNNER_TEMP/aws-calls.log"
          grep -q -- "--if-none-match \*" "$RUNNER_TEMP/aws-calls.log"

      - name: Generate deploy manifest with an explicit backdated timestamp
        id: generate-backdated
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: us-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          deployment-timestamp: '2026-08-01T00:00:00Z'
          s3-folder: schemas

      - name: explicit deployment-timestamp is used as-is
        run: |
          MANIFEST='${{ steps.generate-backdated.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.deploymentTimestamp')" = "2026-08-01T00:00:00Z" ]
          [ "$(echo "$MANIFEST" | jq -r '.deployConfig')" = "null" ]
          [ "${{ steps.generate-backdated.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements-1.0.0-us-production-2026-08-01T000000Z.deploy-manifest.json" ]

      - name: Generate deploy manifest with an unresolved build reference
        id: generate-unresolved-build-ref
        uses: ./generate-deploy-manifest
        with:
          component: does-not-exist
          version: 9.9.9
          target-environment: eu-production
          build-manifest-ref: manifests/build/does-not-exist-9.9.9.json
          s3-folder: schemas

      - name: build-manifest-ref recorded as-is, not validated
        run: |
          MANIFEST='${{ steps.generate-unresolved-build-ref.outputs.manifest-json }}'
          [ "$(echo "$MANIFEST" | jq -r '.buildManifestRef')" = "manifests/build/does-not-exist-9.9.9.json" ]

      - name: Generate deploy manifest containing shell-like literal data
        id: generate-literal-data
        uses: ./generate-deploy-manifest
        with:
          component: "page's-component"
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: "s3://builds.example/page's-build.json?value=$(literal)"
          s3-folder: pages
          deploy-config: |
            NOTE=customer's deployment
            COMMAND=$(this-must-not-run)

      - name: quotes and shell-like text remain literal
        env:
          MANIFEST: ${{ steps.generate-literal-data.outputs.manifest-json }}
          EXPECTED_REF: "s3://builds.example/page's-build.json?value=$(literal)"
        run: |
          [ "$(jq -r '.component' <<< "$MANIFEST")" = "page's-component" ]
          [ "$(jq -r '.buildManifestRef' <<< "$MANIFEST")" = "$EXPECTED_REF" ]
          jq -e '.deployConfig | contains("COMMAND=$(this-must-not-run)")' <<< "$MANIFEST"

      - name: generate-path-traversal-component-should-fail
        id: generate-traversal
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: '../../etc/passwd'
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: manifests/build/does-not-exist-9.9.9.json
          s3-folder: schemas

      - name: path-traversal component fails loudly
        run: |
          [ "${{ steps.generate-traversal.outcome }}" = "failure" ]

      - name: generate-invalid-timestamp-should-fail
        id: generate-invalid-timestamp
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: manifests/build/blood-pressure-measurements-1.0.0.json
          deployment-timestamp: '../../../../tmp/file'
          s3-folder: schemas

      - name: invalid timestamp fails loudly
        run: |
          [ "${{ steps.generate-invalid-timestamp.outcome }}" = "failure" ]

      - name: generate-line-break-component-should-fail
        id: generate-line-break
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: |-
            invalid
            component
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: manifests/build/blood-pressure-measurements-1.0.0.json
          s3-folder: schemas

      - name: line-break component fails loudly
        run: |
          [ "${{ steps.generate-line-break.outcome }}" = "failure" ]

      - name: generate-custom-s3-key
        id: generate-custom-key
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: schemas
          s3-key: schemas/blood-pressure-measurements/1.0.0-eu-production.deploy-manifest.json

      - name: custom s3-key overrides the folder-derived default
        run: |
          [ "${{ steps.generate-custom-key.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/schemas/blood-pressure-measurements/1.0.0-eu-production.deploy-manifest.json" ]
          grep -q -- "--bucket manifests.fibricheck.com --key schemas/blood-pressure-measurements/1.0.0-eu-production.deploy-manifest.json --body" "$RUNNER_TEMP/aws-calls.log"

      - name: Existing deploy manifest is not overwritten
        id: generate-existing-deploy-manifest
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: schemas
          s3-key: schemas/already-exists.deploy-manifest.json

      - name: Existing deploy manifest fails loudly
        run: |
          [ "${{ steps.generate-existing-deploy-manifest.outcome }}" = "failure" ]

      - name: generate-s3-key-line-break-should-fail
        id: generate-s3-key-newline
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: schemas
          s3-key: |-
            invalid
            key

      - name: s3-key line break fails loudly
        run: |
          [ "${{ steps.generate-s3-key-newline.outcome }}" = "failure" ]

      - name: generate-missing-s3-folder-should-fail
        id: generate-missing-folder
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: ''

      - name: missing s3-folder fails loudly
        run: |
          [ "${{ steps.generate-missing-folder.outcome }}" = "failure" ]

      - name: generate-invalid-s3-folder-should-fail
        id: generate-bad-folder
        continue-on-error: true
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: shema

      - name: invalid s3-folder fails loudly
        run: |
          [ "${{ steps.generate-bad-folder.outcome }}" = "failure" ]

      - name: generate-s3-folder-test
        id: generate-s3-folder-test
        uses: ./generate-deploy-manifest
        with:
          component: blood-pressure-measurements
          version: 1.0.0
          target-environment: eu-production
          build-manifest-ref: ${{ steps.generate-build.outputs.manifest-path }}
          s3-folder: test

      - name: s3-folder value "test" is accepted
        run: |
          MANIFEST='${{ steps.generate-s3-folder-test.outputs.manifest-json }}'
          TIMESTAMP=$(echo "$MANIFEST" | jq -r '.deploymentTimestamp' | tr -d ':')
          [ "${{ steps.generate-s3-folder-test.outputs.s3-uri }}" = "s3://manifests.fibricheck.com/test/blood-pressure-measurements-1.0.0-eu-production-${TIMESTAMP}.deploy-manifest.json" ]
