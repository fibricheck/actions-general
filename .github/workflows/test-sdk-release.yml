name: Test SDK Release

on:
  workflow_call:

jobs: 
  test-sdk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sdk-release-dev
        id: sdk-release-dev
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          version: 1.4.0
          type: dev
          dry_run: true
          release_filename: 'dev-release.json'

      - name: sdk-release-prod
        id: sdk-release-prod
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          version: 1.4.0
          type: prod
          dry_run: true
          release_filename: 'prod-release.json'

      - name: sdk-release-snapshot
        id: sdk-release-snapshot
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          version: 1.4.0
          type: snapshot
          dry_run: true
          release_filename: 'snapshot-release.json'
      
      - name: Validate outputs
        run: |
          failed=0

          if [[ "${{ steps.sdk-release-dev.outputs.tag }}" != "1.4.0-dev.1" ]]; then
            echo "::error::sdk-release-dev: expected '1.4.0-dev.1', got '${{ steps.sdk-release-dev.outputs.tag }}'"
            failed=1
          fi

          if [[ "${{ steps.sdk-release-prod.outputs.tag }}" != "1.4.0" ]]; then
            echo "::error::sdk-release-prod: expected '1.4.0', got '${{ steps.sdk-release-prod.outputs.tag }}'"
            failed=1
          fi

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BRANCH_HASH=$(echo -n "$BRANCH" | sha1sum | cut -c 1-16)
          EXPECTED_SNAPSHOT="1.4.0-${BRANCH_HASH}.1"
          if [[ "${{ steps.sdk-release-snapshot.outputs.tag }}" != "$EXPECTED_SNAPSHOT" ]]; then
            echo "::error::sdk-release-snapshot: expected '$EXPECTED_SNAPSHOT', got '${{ steps.sdk-release-snapshot.outputs.tag }}'"
            failed=1
          fi

          # Validate dev-release.json
          if [[ ! -f "dev-release.json" ]]; then
            echo "::error::dev-release.json file was not created"
            failed=1
          else
            JSON_VERSION=$(jq -r '.version' dev-release.json)
            JSON_DATE=$(jq -r '.releaseDate' dev-release.json)

            if [[ "$JSON_VERSION" != "1.4.0-dev.1" ]]; then
              echo "::error::dev-release.json version: expected '1.4.0-dev.1', got '$JSON_VERSION'"
              failed=1
            fi
            if [[ ! "$JSON_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::dev-release.json releaseDate: invalid format '$JSON_DATE', expected YYYY-MM-DD"
              failed=1
            fi
          fi

          # Validate prod-release.json
          if [[ ! -f "prod-release.json" ]]; then
            echo "::error::prod-release.json file was not created"
            failed=1
          else
            JSON_VERSION=$(jq -r '.version' prod-release.json)
            JSON_DATE=$(jq -r '.releaseDate' prod-release.json)

            if [[ "$JSON_VERSION" != "1.4.0" ]]; then
              echo "::error::prod-release.json version: expected '1.4.0', got '$JSON_VERSION'"
              failed=1
            fi
            if [[ ! "$JSON_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::prod-release.json releaseDate: invalid format '$JSON_DATE', expected YYYY-MM-DD"
              failed=1
            fi
          fi

          # Validate snapshot-release.json
          if [[ ! -f "snapshot-release.json" ]]; then
            echo "::error::snapshot-release.json file was not created"
            failed=1
          else
            JSON_VERSION=$(jq -r '.version' snapshot-release.json)
            JSON_DATE=$(jq -r '.releaseDate' snapshot-release.json)

            if [[ "$JSON_VERSION" != "$EXPECTED_SNAPSHOT" ]]; then
              echo "::error::snapshot-release.json version: expected '$EXPECTED_SNAPSHOT', got '$JSON_VERSION'"
              failed=1
            fi
            if [[ ! "$JSON_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::snapshot-release.json releaseDate: invalid format '$JSON_DATE', expected YYYY-MM-DD"
              failed=1
            fi
          fi

          if [[ $failed -eq 1 ]]; then
            exit 1
          fi

          echo "All validations passed!"