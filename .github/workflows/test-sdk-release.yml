name: Test SDK Release

on:
  workflow_call:

jobs:
  test-sdk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Create release files that the action will read from
      - name: Setup test release files
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Dev release file (with today's date)
          echo '{"version": "1.4.0", "releaseDate": "'$TODAY'"}' > dev-release.json

          # Prod release file (with today's date)
          echo '{"version": "1.4.0", "releaseDate": "'$TODAY'"}' > prod-release.json

          # Snapshot release file (date doesn't matter for snapshots)
          echo '{"version": "1.4.0", "releaseDate": "2024-01-01"}' > snapshot-release.json

      - name: sdk-release-dev
        id: sdk-release-dev
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          type: dev
          dry_run: true
          release_filename: 'dev-release.json'

      - name: sdk-release-prod
        id: sdk-release-prod
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          type: prod
          dry_run: true
          release_filename: 'prod-release.json'

      - name: sdk-release-snapshot
        id: sdk-release-snapshot
        uses: ./sdk-release
        with:
          token: ${{ github.token }}
          type: snapshot
          dry_run: true
          release_filename: 'snapshot-release.json'

      - name: Validate outputs
        run: |
          failed=0

          # Dev should be v1.4.0-dev.1 (first dev release for this version)
          if [[ "${{ steps.sdk-release-dev.outputs.tag }}" != "v1.4.0-dev.1" ]]; then
            echo "::error::sdk-release-dev: expected 'v1.4.0-dev.1', got '${{ steps.sdk-release-dev.outputs.tag }}'"
            failed=1
          fi

          # Prod should be v1.4.0
          if [[ "${{ steps.sdk-release-prod.outputs.tag }}" != "v1.4.0" ]]; then
            echo "::error::sdk-release-prod: expected 'v1.4.0', got '${{ steps.sdk-release-prod.outputs.tag }}'"
            failed=1
          fi

          # Snapshot should be v1.4.0-snapshot.<commit_hash>
          COMMIT_HASH=$(git rev-parse --short HEAD)
          EXPECTED_SNAPSHOT="v1.4.0-snapshot.${COMMIT_HASH}"
          if [[ "${{ steps.sdk-release-snapshot.outputs.tag }}" != "$EXPECTED_SNAPSHOT" ]]; then
            echo "::error::sdk-release-snapshot: expected '$EXPECTED_SNAPSHOT', got '${{ steps.sdk-release-snapshot.outputs.tag }}'"
            failed=1
          fi

          if [[ $failed -eq 1 ]]; then
            exit 1
          fi

          echo "All validations passed!"
