name: 'Increment (S3)'
description: 'Increments and returns a number in a json file on S3'

inputs:
  s3-file-path: 
    description: 'The path to the JSON file on S3 (eg: s3://this.is.an.example.com/builds/build-numbers.json)'
    required: true
    type: string

  key-selector:
    description: 'The jq key selector (eg: .versionCodes.my-build)'
    required: true
    type: string

  access-key-id: 
    description: 'The S3 access key id'
    required: true
    type: string

  secret-access-key:
    required: true
    type: string

  region:
    required: true
    type: string
    default: "eu-central-1"

outputs:
  old-build-number:
    description: "The version number (eg: 2.11.0)"
    value: ${{ steps.increment-build-number.outputs.old-code }}

  new-build-number:
    description: "The build variant (eg: eu/us/research)"
    value: ${{ steps.increment-build-number.outputs.new-code }}

runs:
  using: "composite"
  steps:
    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: ${{ inputs.region }}
          
    - name: Get & Increment Build Number
      id: increment-build-number
      shell: bash
      run: | 
        aws s3 cp "${{ inputs.s3-file-path }}" ./s3-ibn-info.json || echo "{}" > s3-ibn-info.json
        OLD_CODE=$(jq '${{ inputs.key-selector }} // 0' s3-ibn-info.json)
        NEW_CODE=$(( $OLD_CODE + 1 ))
        jq "${{ inputs.key-selector }}=$NEW_CODE" s3-ibn-info.json > s3-ibn-info.tmp
        mv s3-ibn-info.tmp s3-ibn-info.json
        aws s3 cp s3-ibn-info.json "${{ inputs.s3-file-path }}"
        echo "old-code=$OLD_CODE" >> $GITHUB_OUTPUT
        echo "new-code=$NEW_CODE" >> $GITHUB_OUTPUT
