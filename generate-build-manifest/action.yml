name: 'Generate Build Manifest'
description: 'Builds a traceability manifest JSON, writes it locally, and stores it in the shared FibriCheck manifests store. Does not commit or push.'
inputs:
  component:
    description: 'Name of the component or schema that was built'
    required: true
  version:
    description: 'Version of the build (e.g. semver)'
    required: true
  repo:
    description: 'Repository the build came from, owner/name. Required when commit-sha is given'
    required: false
    default: ''
  commit-sha:
    description: 'Commit sha the build was produced from. Required unless component-manifests is given'
    required: false
    default: ''
  commit-tag:
    description: 'Git tag for the commit, if one exists'
    required: false
    default: ''
  build-number:
    description: 'Platform build number, when the component has one (e.g. a mobile app build)'
    required: false
    default: ''
  target-environment:
    description: 'Environment this build was produced for, when applicable (e.g. eu-production)'
    required: false
    default: ''
  ci-reference:
    description: >
      CI build identifier (e.g. a GitHub Actions run ID), supplied by the calling workflow — this
      action does not read GitHub context itself. Best-effort only: GitHub's workflow-run retention
      window (90 days as of 2026-10-01) means this can stop resolving to anything long before this
      manifest's own retention period ends. commit-sha remains the durable reference; treat this as
      a convenience lookup, not a guarantee.
    required: false
    default: ''
  build-output-references:
    description: 'Comma-separated list of references to the build outputs: names of local files, or Docker image references on ECR'
    required: false
    default: ''
  component-manifests:
    description: >
      Comma-separated list of existing component build manifests this manifest combines, as manifest
      references (the manifest-ref output of the action that created them, e.g.
      tasks/delete-user/1.1.7/build-manifest.json). Each one must be a build manifest and must exist; the
      action fails before uploading anything if one does not.
    required: false
    default: ''
  udi:
    description: 'Unique Device Identifier, if applicable'
    required: false
    default: ''
  build-config:
    description: >
      Build-time configuration to embed as-is. Pass a JSON object/string when one already exists
      (e.g. a config file read with `cat`); pass raw text otherwise (e.g. a multi-line KEY=value
      block) and it will be embedded as a JSON string, unparsed.
    required: false
    default: ''
  tooling:
    description: 'JSON object containing the toolchain versions used for the build (e.g. Node, Xcode, Gradle)'
    required: false
    default: ''
  build-timestamp:
    description: 'When the build actually happened, as YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ. Defaults to now. Pass this explicitly when recording a build after the fact (e.g. backfilling a manifest for a build that predates this action). A date-only value is normalized to midnight UTC.'
    required: false
    default: ''
  folder:
    description: >
      Top-level folder within the manifests store: app, pages, schemas, tasks, packages, test, or composites.
      composites is required when component-manifests is given, and not allowed otherwise.
      Required — every manifest is stored. The manifest is stored as
      <folder>/<component>/<version>[-<build-number>]/[<target-environment>.]build-manifest.json.
      Storing is create-only and fails if the manifest already exists, unless overwrite is 'true'.
      Retention is applied by the store's own default retention rule, not by this
      action — "test" is not exempt from it.
    required: true
  files:
    description: >
      Files that belong to the build (e.g. archives, test results), one path per line, relative to the working
      directory. A directory uploads all files in it. Each file is uploaded next to the manifest, keeping its relative
      path: <manifest folder>/<path>. Files are uploaded before the manifest, so a manifest only exists once all of
      its files are there. Uploads are create-only with a SHA256 checksum; a file that already exists with the same
      checksum (a re-run after a partial upload) is accepted, one with a different checksum fails the upload (see
      overwrite). Empty directories and files named [*.]build-manifest.json or [*.]deploy-manifest.json are rejected.
    required: false
    default: ''
  overwrite:
    description: >
      'true' stores the manifest and its files even when they already exist, as a new object version. The
      previous version is kept by the store.
    required: false
    default: 'false'
  role-arn:
    description: >
      IAM role assumed through GitHub OIDC to access the manifests store. The calling job needs the
      id-token: write permission. The credentials are only used by this action and never replace AWS
      credentials configured elsewhere in the job. Set to '' to skip authentication and use the AWS
      credentials already configured in the job instead.
    required: false
    default: 'arn:aws:iam::964503429135:role/github-manifests'
outputs:
  manifest-json:
    description: 'The generated manifest, as a JSON string'
    value: ${{ steps.generate.outputs.manifest-json }}
  manifest-path:
    description: 'Path the manifest was written to'
    value: ${{ steps.generate.outputs.manifest-path }}
  manifest-ref:
    description: 'Reference to the stored manifest, e.g. tasks/delete-user/1.1.7/build-manifest.json'
    value: ${{ steps.generate.outputs.manifest-ref }}
  file-refs:
    description: 'References to the stored files, one per line'
    value: ${{ steps.generate.outputs.file-refs }}
runs:
  using: 'composite'
  steps:
    - name: Check OIDC permission
      if: inputs.role-arn != ''
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::the calling job needs the id-token: write permission to authenticate to AWS"
          exit 1
        fi
    - name: Authenticate to AWS
      id: aws-auth
      if: inputs.role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: eu-central-1
        output-credentials: true
        output-env-credentials: false
    - name: Generate
      id: generate
      shell: bash
      env:
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_COMMIT_SHA: ${{ inputs.commit-sha }}
        INPUT_COMMIT_TAG: ${{ inputs.commit-tag }}
        INPUT_BUILD_NUMBER: ${{ inputs.build-number }}
        INPUT_TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
        INPUT_CI_REFERENCE: ${{ inputs.ci-reference }}
        INPUT_BUILD_OUTPUT_REFERENCES: ${{ inputs.build-output-references }}
        INPUT_COMPONENT_MANIFESTS: ${{ inputs.component-manifests }}
        INPUT_UDI: ${{ inputs.udi }}
        INPUT_BUILD_CONFIG: ${{ inputs.build-config }}
        INPUT_TOOLING: ${{ inputs.tooling }}
        INPUT_BUILD_TIMESTAMP: ${{ inputs.build-timestamp }}
        INPUT_FOLDER: ${{ inputs.folder }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
        MANIFESTS_AWS_ACCESS_KEY_ID: ${{ steps.aws-auth.outputs.aws-access-key-id }}
        MANIFESTS_AWS_SECRET_ACCESS_KEY: ${{ steps.aws-auth.outputs.aws-secret-access-key }}
        MANIFESTS_AWS_SESSION_TOKEN: ${{ steps.aws-auth.outputs.aws-session-token }}
      run: |
        set -euo pipefail

        # The manifests role's credentials apply to this step only, other AWS credentials in the job are left as they are
        if [ -n "$MANIFESTS_AWS_ACCESS_KEY_ID" ]; then
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          export AWS_ACCESS_KEY_ID="$MANIFESTS_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$MANIFESTS_AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$MANIFESTS_AWS_SESSION_TOKEN"
          export AWS_REGION="eu-central-1"
        fi

        validate_no_path_traversal() {
          local name="$1" value="$2"
          case "$value" in
            '')
              echo "::error::${name} is required"
              exit 1
              ;;
            */*|*'\'*)
              echo "::error::${name} must not contain '/' or '\\'"
              exit 1
              ;;
            .|..)
              echo "::error::${name} must not be '.' or '..'"
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "::error::${name} must not contain line breaks"
              exit 1
              ;;
          esac
        }
        validate_no_path_traversal "component" "$INPUT_COMPONENT"
        validate_no_path_traversal "version" "$INPUT_VERSION"
        [ -n "$INPUT_BUILD_NUMBER" ] && validate_no_path_traversal "build-number" "$INPUT_BUILD_NUMBER"
        [ -n "$INPUT_TARGET_ENVIRONMENT" ] && validate_no_path_traversal "target-environment" "$INPUT_TARGET_ENVIRONMENT"
        case "$INPUT_OVERWRITE" in
          true|false) ;;
          *)
            echo "::error::overwrite must be 'true' or 'false' — got: ${INPUT_OVERWRITE}"
            exit 1
            ;;
        esac
        case "$INPUT_FOLDER" in
          app|pages|schemas|tasks|packages|test|composites) ;;
          *)
            echo "::error::folder must be one of: app, pages, schemas, tasks, packages, test, composites — got: ${INPUT_FOLDER}"
            exit 1
            ;;
        esac

        # Collect the files to upload as paths relative to the working directory
        FILES=()
        while IFS= read -r ENTRY; do
          # delete trailing and leading whitespace (ugh...)
          ENTRY="${ENTRY#"${ENTRY%%[![:space:]]*}"}"
          ENTRY="${ENTRY%"${ENTRY##*[![:space:]]}"}"
          [ -z "$ENTRY" ] && continue
          ENTRY="${ENTRY#./}"
          while [[ "$ENTRY" == ?*/ ]]; do ENTRY="${ENTRY%/}"; done
          case "/$ENTRY/" in
            *//*|*/../*|*/./*)
              echo "::error::files must be relative paths without '.' or '..' segments — got: ${ENTRY}"
              exit 1
              ;;
          esac
          if [ -f "$ENTRY" ]; then
            FILES+=("$ENTRY")
          elif [ -d "$ENTRY" ]; then
            COUNT_BEFORE=${#FILES[@]}
            while IFS= read -r -d '' FOUND; do
              FILES+=("${FOUND#./}")
            done < <(find -L "$ENTRY" -type f -print0 | sort -z)
            if [ "${#FILES[@]}" -eq "$COUNT_BEFORE" ]; then
              echo "::error::directory contains no files: ${ENTRY}"
              exit 1
            fi
          else
            echo "::error::file not found: ${ENTRY}"
            exit 1
          fi
        done <<< "$INPUT_FILES"
        if [ -n "$(printf '%s\n' "${FILES[@]+"${FILES[@]}"}" | sort | uniq -d)" ]; then
          echo "::error::files contains duplicate paths"
          exit 1
        fi

        S3_BUCKET="manifests.fibricheck.com"

        # Every referenced component manifest must already exist, checked before anything is uploaded
        COMPONENT_MANIFESTS=$(jq -Rn --arg value "$INPUT_COMPONENT_MANIFESTS" '$value | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')

        # A manifest must trace back to its source: its own commit, or the component manifests it combines
        if [ -z "$INPUT_COMMIT_SHA" ] && [ "$(jq 'length' <<< "$COMPONENT_MANIFESTS")" -eq 0 ]; then
          echo "::error::commit-sha or component-manifests is required"
          exit 1
        fi
        if [ -n "$INPUT_COMMIT_SHA" ] && [ -z "$INPUT_REPO" ]; then
          echo "::error::repo is required when commit-sha is given"
          exit 1
        fi

        # Composite manifests live in the composites folder, and only there
        if [ "$(jq 'length' <<< "$COMPONENT_MANIFESTS")" -gt 0 ] && [ "$INPUT_FOLDER" != "composites" ]; then
          echo "::error::folder must be composites when component-manifests is given — got: ${INPUT_FOLDER}"
          exit 1
        fi
        if [ "$(jq 'length' <<< "$COMPONENT_MANIFESTS")" -eq 0 ] && [ "$INPUT_FOLDER" = "composites" ]; then
          echo "::error::folder composites requires component-manifests"
          exit 1
        fi

        HEAD_ERR=$(mktemp)
        while IFS= read -r REF; do
          KEY="$REF"
          case "/$KEY/" in
            *//*|*/../*|*/./*)
              echo "::error::component-manifests must be manifest references (the manifest-ref output of the action that created them) — got: ${REF}"
              exit 1
              ;;
          esac
          if [[ ".${KEY##*/}" != *.build-manifest.json ]]; then
            echo "::error::component-manifests must reference build manifests — got: ${REF}"
            exit 1
          fi
          if ! aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" >/dev/null 2>"$HEAD_ERR"; then
            if grep -q "(404)" "$HEAD_ERR"; then
              echo "::error::component manifest does not exist: ${REF}"
            else
              cat "$HEAD_ERR" >&2
            fi
            exit 1
          fi
        done < <(jq -r '.[]' <<< "$COMPONENT_MANIFESTS")
        rm -f "$HEAD_ERR"

        TIMESTAMP="$INPUT_BUILD_TIMESTAMP"
        [ -z "$TIMESTAMP" ] && TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        if [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          TIMESTAMP="${TIMESTAMP}T00:00:00Z"
        elif ! [[ "$TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
          echo "::error::build-timestamp must use YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ"
          exit 1
        fi

        FILENAME_SAFE_TIMESTAMP=$(echo "$TIMESTAMP" | tr -d ':')
        OUTPUT_PATH="manifests/build/${INPUT_COMPONENT}-${INPUT_VERSION}-${FILENAME_SAFE_TIMESTAMP}.json"
        mkdir -p "$(dirname "$OUTPUT_PATH")"

        REPO="$INPUT_REPO"
        [ -z "$REPO" ] && REPO=null || REPO=$(jq -Rn --arg v "$REPO" '$v')

        COMMIT_SHA="$INPUT_COMMIT_SHA"
        [ -z "$COMMIT_SHA" ] && COMMIT_SHA=null || COMMIT_SHA=$(jq -Rn --arg v "$COMMIT_SHA" '$v')

        COMMIT_TAG="$INPUT_COMMIT_TAG"
        [ -z "$COMMIT_TAG" ] && COMMIT_TAG=null || COMMIT_TAG=$(jq -Rn --arg v "$COMMIT_TAG" '$v')

        BUILD_NUMBER="$INPUT_BUILD_NUMBER"
        [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER=null || BUILD_NUMBER=$(jq -Rn --arg v "$BUILD_NUMBER" '$v')

        TARGET_ENVIRONMENT="$INPUT_TARGET_ENVIRONMENT"
        [ -z "$TARGET_ENVIRONMENT" ] && TARGET_ENVIRONMENT=null || TARGET_ENVIRONMENT=$(jq -Rn --arg v "$TARGET_ENVIRONMENT" '$v')

        CI_REFERENCE="$INPUT_CI_REFERENCE"
        [ -z "$CI_REFERENCE" ] && CI_REFERENCE=null || CI_REFERENCE=$(jq -Rn --arg v "$CI_REFERENCE" '$v')

        UDI="$INPUT_UDI"
        [ -z "$UDI" ] && UDI=null || UDI=$(jq -Rn --arg v "$UDI" '$v')

        BUILD_OUTPUT_REFERENCES=$(jq -Rn --arg value "$INPUT_BUILD_OUTPUT_REFERENCES" '$value | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')

        BUILD_CONFIG_INPUT="$INPUT_BUILD_CONFIG"
        if [ -z "$BUILD_CONFIG_INPUT" ]; then
          BUILD_CONFIG=null
        elif echo "$BUILD_CONFIG_INPUT" | jq empty 2>/dev/null; then
          BUILD_CONFIG="$BUILD_CONFIG_INPUT"
        else
          BUILD_CONFIG=$(printf '%s' "$BUILD_CONFIG_INPUT" | jq -Rs '.')
        fi

        if [ -z "$INPUT_TOOLING" ]; then
          TOOLING=null
        elif ! TOOLING=$(printf '%s' "$INPUT_TOOLING" | jq -ce 'if type == "object" then . else error("tooling must be a JSON object") end'); then
          echo "::error::tooling must be a valid JSON object"
          exit 1
        fi

        MANIFEST=$(jq -n \
          --arg component "$INPUT_COMPONENT" \
          --arg version "$INPUT_VERSION" \
          --argjson repo "$REPO" \
          --argjson sha "$COMMIT_SHA" \
          --argjson tag "$COMMIT_TAG" \
          --argjson buildNumber "$BUILD_NUMBER" \
          --argjson targetEnvironment "$TARGET_ENVIRONMENT" \
          --argjson ciReference "$CI_REFERENCE" \
          --argjson buildOutputReferences "$BUILD_OUTPUT_REFERENCES" \
          --argjson componentManifests "$COMPONENT_MANIFESTS" \
          --arg buildTimestamp "$TIMESTAMP" \
          --argjson udi "$UDI" \
          --argjson buildConfig "$BUILD_CONFIG" \
          --argjson tooling "$TOOLING" \
          '{
            manifestVersion: "1.0",
            component: $component,
            version: $version,
            buildNumber: $buildNumber,
            targetEnvironment: $targetEnvironment,
            ciReference: $ciReference,
            buildOutputReferences: $buildOutputReferences,
            componentManifests: $componentManifests,
            commit: { repo: $repo, sha: $sha, tag: $tag },
            buildTimestamp: $buildTimestamp,
            udi: $udi,
            buildConfig: $buildConfig,
            tooling: $tooling
          }')

        printf '%s\n' "$MANIFEST" > "$OUTPUT_PATH"

        VERSION_FOLDER="$INPUT_VERSION"
        [ -n "$INPUT_BUILD_NUMBER" ] && VERSION_FOLDER="${VERSION_FOLDER}-${INPUT_BUILD_NUMBER}"
        FILENAME_PREFIX=""
        [ -n "$INPUT_TARGET_ENVIRONMENT" ] && FILENAME_PREFIX="${INPUT_TARGET_ENVIRONMENT}."
        S3_KEY="${INPUT_FOLDER}/${INPUT_COMPONENT}/${VERSION_FOLDER}/${FILENAME_PREFIX}build-manifest.json"

        # Files are uploaded before the manifest, so a manifest is only created once all its files exist.
        FILE_REFS=""
        if [ "${#FILES[@]}" -gt 0 ]; then
          FILES_PREFIX="${S3_KEY%/*}"
          # Checked before the first upload, so a rejected file never leaves earlier files behind
          for FILE in "${FILES[@]}"; do
            if [[ ".${FILE##*/}" == *.build-manifest.json || ".${FILE##*/}" == *.deploy-manifest.json ]]; then
              echo "::error::file ${FILE} would be mistaken for a manifest"
              exit 1
            fi
          done
          UPLOAD_ERR=$(mktemp)
          for FILE in "${FILES[@]}"; do
            FILE_KEY="${FILES_PREFIX}/${FILE}"
            CHECKSUM=$(openssl dgst -sha256 -binary "$FILE" | base64)

            if [ "$INPUT_OVERWRITE" = "true" ]; then
              aws s3api put-object --bucket "$S3_BUCKET" --key "$FILE_KEY" --body "$FILE" \
                --checksum-algorithm SHA256 --checksum-sha256 "$CHECKSUM" >/dev/null
              FILE_REFS="${FILE_REFS}${FILE_KEY}"$'\n'
              continue
            fi

            # Create-only upload. When the file already exists (a re-run after a partial upload), it is only
            # accepted if it has the same content.
            if ! aws s3api put-object --bucket "$S3_BUCKET" --key "$FILE_KEY" --body "$FILE" \
              --checksum-algorithm SHA256 --checksum-sha256 "$CHECKSUM" --if-none-match '*' >/dev/null 2>"$UPLOAD_ERR"; then
              if ! grep -q "PreconditionFailed" "$UPLOAD_ERR"; then
                cat "$UPLOAD_ERR" >&2
                exit 1
              fi
              EXISTING=$(aws s3api head-object --bucket "$S3_BUCKET" --key "$FILE_KEY" --checksum-mode ENABLED \
                --query ChecksumSHA256 --output text)
              if [ "$EXISTING" != "$CHECKSUM" ]; then
                echo "::error::${FILE_KEY} already exists with different content"
                exit 1
              fi
              echo "${FILE_KEY} already exists with the same content"
            fi
            FILE_REFS="${FILE_REFS}${FILE_KEY}"$'\n'
          done
          rm -f "$UPLOAD_ERR"
        fi

        # Create-only upload: never create a newer object version under an existing manifest key, unless overwrite is enabled.
        if [ "$INPUT_OVERWRITE" = "true" ]; then
          aws s3api put-object --bucket "$S3_BUCKET" --key "$S3_KEY" --body "$OUTPUT_PATH" >/dev/null
        else
          aws s3api put-object --bucket "$S3_BUCKET" --key "$S3_KEY" --body "$OUTPUT_PATH" --if-none-match '*' >/dev/null
        fi

        DELIMITER="manifest_$(date +%s)_$RANDOM"
        printf 'manifest-path=%s\n' "$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        printf 'manifest-ref=%s\n' "$S3_KEY" >> "$GITHUB_OUTPUT"
        printf 'file-refs<<%s\n%s%s\n' "$DELIMITER" "$FILE_REFS" "$DELIMITER" >> "$GITHUB_OUTPUT"
        printf 'manifest-json<<%s\n%s\n%s\n' "$DELIMITER" "$MANIFEST" "$DELIMITER" >> "$GITHUB_OUTPUT"
