name: Generate Build Manifest Example

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Generate Build Manifest
        id: generate-build-manifest
        uses: fibricheck/actions-general/generate-build-manifest@v5
        with:
          component: 'blood-pressure-measurements'
          version: '1.0.0'
          repo: ${{ github.repository }}
          commit-sha: ${{ github.sha }}
          target-environment: 'eu-production'
          build-config: ''
          tooling: '{"node":"20"}'
          folder: 'schemas'

      - run: |
          echo "Manifest written to: ${{ steps.generate-build-manifest.outputs.manifest-path }}"
